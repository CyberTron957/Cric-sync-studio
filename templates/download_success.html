<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Success - Cricket Video Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div class="mb-4">
                            <i class="fas fa-check-circle text-success fa-5x"></i>
                        </div>
                        <h1 class="card-title mb-4">Download Complete!</h1>
                        <p class="lead mb-4">Your cricket highlight video has been successfully downloaded.</p>
                        
                        <div class="mt-4 mb-5">
                            <p>If your download didn't start automatically, click below:</p>
                            <a href="{{ url_for('download_file', session_id=session_id) }}" class="btn btn-success mb-3" id="download-again-btn">
                                <i class="fas fa-download"></i> Download Video Again
                            </a>
                        </div>
                        
                        <div class="d-flex justify-content-center gap-3 mt-5">
                            <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-lg">
                                <i class="fas fa-plus-circle"></i> Create New Project
                            </a>
                            <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary btn-lg">
                                <i class="fas fa-user"></i> Return to Profile
                            </a>
                        </div>
                        
                        {% if session_id %}
                        <div class="mt-4">
                            <a href="{{ url_for('editor', session_id=session_id) }}" class="btn btn-link" id="back-to-editor-btn">
                                <i class="fas fa-arrow-left"></i> Back to Editor
                            </a>
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    
    <script>
        // Automatically trigger download when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Use a small delay to ensure browser doesn't block the automatic download
            setTimeout(function() {
                window.open("{{ url_for('download_file', session_id=session_id) }}", "_blank");
            }, 500);
            
            // Handle back to editor button to ensure we don't lose timestamps
            const backToEditorBtn = document.getElementById('back-to-editor-btn');
            if (backToEditorBtn) {
                backToEditorBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    // Navigate back to editor without losing state
                    window.location.href = this.href;
                });
            }
        });
    </script>
</body>
</html>
